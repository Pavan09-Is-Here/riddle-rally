<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173d36" />
    <title>Riddle Rally — find the hidden thing</title>
    <meta name="description" content="A live, room-code party game of location riddles and hidden objects for two to eight friends." />
    <meta property="og:title" content="Riddle Rally" />
    <meta property="og:description" content="Read the place clue, find your private item clue, and race your friends." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://play.riddle-rally.workers.dev/cover.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Riddle Rally" />
    <meta name="twitter:description" content="A live party game of location riddles and hidden objects." />
    <meta name="twitter:image" content="https://play.riddle-rally.workers.dev/cover.svg" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
        --paper: #f3ead8;
        --paper-deep: #e6d6b7;
        --paper-light: #fffaf0;
        --ink: #27343a;
        --muted: #69716c;
        --line: #cfc0a2;
        --pine: #173d36;
        --pine-light: #286052;
        --indigo: #35436a;
        --coral: #cb604d;
        --brass: #a77933;
        --success: #286052;
        --danger: #a83e36;
        --shadow: 0 18px 50px rgb(57 43 23 / 12%);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        color: var(--ink);
        background:
          radial-gradient(ellipse at 14% 5%, rgb(255 250 240 / 85%), transparent 36rem),
          radial-gradient(ellipse at 92% 16%, rgb(203 96 77 / 8%), transparent 28rem),
          repeating-linear-gradient(0deg, rgb(74 56 29 / 1.3%) 0, rgb(74 56 29 / 1.3%) 1px, transparent 1px, transparent 5px),
          var(--paper);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 22px;
      }
      button, input { font: inherit; }
      button { color: inherit; }
      button:focus-visible, input:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
      button:disabled { cursor: not-allowed; opacity: .5; }
      .app-shell { width: min(1120px, 100%); margin: 0 auto; }
      .masthead { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin: 0 auto 22px; }
      .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--pine); font: 700 1.35rem/1 Georgia, "Times New Roman", serif; letter-spacing: -.03em; text-decoration: none; }
      .brand-mark { width: 37px; height: 37px; display: grid; place-items: center; border: 1px solid var(--brass); border-radius: 50%; background: var(--paper-light); box-shadow: inset 0 0 0 3px var(--paper-deep); }
      .brand-mark svg { width: 21px; height: 21px; }
      .room-chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: rgb(255 250 240 / 70%); color: var(--indigo); font-size: .82rem; font-weight: 750; letter-spacing: .05em; }
      .room-chip strong { color: var(--pine); font-variant-numeric: tabular-nums; }
      .paper-card { border: 1px solid var(--line); border-radius: 22px; background: rgb(255 250 240 / 92%); box-shadow: var(--shadow); }
      .home-card { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(260px, .85fr); min-height: 490px; }
      .home-copy { position: relative; z-index: 1; align-self: center; padding: clamp(28px, 6vw, 68px); }
      .eyebrow { margin: 0 0 12px; color: var(--coral); font-size: .76rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1, h2, h3, p { margin-top: 0; }
      h1, h2, h3 { color: var(--pine); font-family: Georgia, "Times New Roman", serif; }
      h1 { max-width: 600px; margin-bottom: 16px; font-size: clamp(3rem, 7vw, 5.4rem); line-height: .98; letter-spacing: -.065em; }
      .lead { max-width: 490px; margin-bottom: 28px; color: #4f5b59; font-size: 1.12rem; }
      .home-actions { display: grid; gap: 14px; max-width: 420px; }
      .join-form { display: flex; gap: 8px; }
      .text-input { min-width: 0; width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fffdf7; color: var(--ink); }
      .text-input::placeholder { color: #8a8a7c; }
      .join-form .text-input { text-transform: uppercase; letter-spacing: .08em; font-weight: 800; }
      .button { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border: 1px solid transparent; border-radius: 12px; background: var(--pine); color: var(--paper-light); cursor: pointer; font-weight: 780; transition: transform 130ms ease, background 130ms ease, box-shadow 130ms ease; }
      .button:hover:not(:disabled) { transform: translateY(-1px); background: var(--pine-light); box-shadow: 0 6px 14px rgb(23 61 54 / 18%); }
      .button.secondary { border-color: var(--line); background: var(--paper-light); color: var(--pine); }
      .button.secondary:hover:not(:disabled) { background: var(--paper); }
      .button.coral { background: var(--coral); }
      .button.small { min-height: 36px; padding: 7px 11px; border-radius: 10px; font-size: .85rem; }
      .home-art { position: relative; min-height: 360px; display: grid; place-items: center; background: radial-gradient(ellipse at 55% 42%, #fff8e7 0, #eadbbd 58%, #d8c49d 100%); }
      .home-art::before, .home-art::after { position: absolute; content: ""; border: 1px solid rgb(167 121 51 / 25%); border-radius: 50%; }
      .home-art::before { width: 320px; height: 320px; }
      .home-art::after { width: 250px; height: 250px; }
      .home-art svg { position: relative; z-index: 1; width: min(90%, 390px); filter: drop-shadow(0 16px 18px rgb(51 39 20 / 18%)); }
      .fine-print { margin: 4px 0 0; color: var(--muted); font-size: .82rem; }
      .screen { display: grid; gap: 18px; }
      .screen-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding: 22px 24px; }
      .screen-header h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.7rem); line-height: 1.05; letter-spacing: -.045em; }
      .screen-header p { margin: 8px 0 0; color: var(--muted); }
      .header-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
      .lobby-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(270px, .7fr); gap: 18px; }
      .section-card { padding: 22px; }
      .section-card h2 { margin-bottom: 5px; font-size: 1.35rem; }
      .section-note { margin-bottom: 16px; color: var(--muted); font-size: .9rem; }
      .field-label { display: block; margin-bottom: 6px; color: var(--pine); font-size: .83rem; font-weight: 800; }
      .name-row { display: flex; align-items: flex-end; gap: 8px; margin: 0 0 19px; }
      .name-row label { flex: 1; }
      .choice-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
      .choice-card { min-height: 112px; padding: 13px; border: 1px solid var(--line); border-radius: 14px; background: #fffdf8; text-align: left; cursor: pointer; }
      .choice-card strong { display: block; margin-bottom: 5px; color: var(--pine); font-size: .92rem; }
      .choice-card span { display: block; color: var(--muted); font-size: .78rem; line-height: 1.38; }
      .choice-card[aria-pressed="true"] { border-color: var(--pine); background: #e5eee8; box-shadow: inset 0 0 0 1px var(--pine); }
      .end-row { display: flex; align-items: end; gap: 12px; margin: 18px 0 0; }
      .end-row label { flex: 1; }
      select, input[type="number"] { min-height: 44px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 11px; background: #fffdf7; color: var(--ink); }
      .players-list { display: grid; gap: 8px; margin: 14px 0 20px; padding: 0; list-style: none; }
      .player-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid #e5dbc7; border-radius: 11px; background: #fffdf8; }
      .player-name { display: inline-flex; align-items: center; gap: 8px; font-weight: 750; }
      .host-tag { padding: 3px 7px; border-radius: 999px; background: #f4e2d8; color: #8e4035; font-size: .68rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
      .player-points { color: var(--pine); font-weight: 850; font-variant-numeric: tabular-nums; }
      .share-box { display: grid; gap: 8px; margin-top: 16px; padding: 13px; border: 1px dashed #c0ad87; border-radius: 13px; background: #f8f0df; }
      .share-box p { margin: 0; color: var(--muted); font-size: .82rem; }
      .share-link { overflow: hidden; padding: 7px 9px; border-radius: 8px; background: #fffdf8; color: var(--indigo); font-size: .8rem; text-overflow: ellipsis; white-space: nowrap; }
      .start-match { width: 100%; margin-top: 4px; }
      .round-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(270px, .72fr); align-items: start; gap: 18px; }
      .clue-card { padding: clamp(20px, 4vw, 34px); }
      .timer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 19px; }
      .hunt-label { color: var(--muted); font-size: .82rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
      .timer { min-width: 74px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: #f7efdf; color: var(--pine); text-align: center; font-size: 1.05rem; font-weight: 900; font-variant-numeric: tabular-nums; }
      .timer.urgent { border-color: #d48a73; background: #fae4d9; color: #9d3f36; }
      .riddle-label { margin-bottom: 8px; color: var(--brass); font-size: .75rem; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
      .riddle-text { max-width: 680px; margin-bottom: 23px; color: var(--indigo); font: 600 clamp(1.45rem, 3vw, 2.15rem)/1.25 Georgia, "Times New Roman", serif; letter-spacing: -.02em; }
      .location-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 9px; }
      .location-button { min-height: 86px; display: grid; align-content: center; justify-items: start; gap: 4px; padding: 12px; border: 1px solid var(--line); border-radius: 13px; background: #fffdf8; cursor: pointer; text-align: left; }
      .location-button:hover:not(:disabled) { border-color: var(--brass); background: #f7efde; }
      .location-button strong { color: var(--pine); }
      .location-icon { font-size: 1.2rem; line-height: 1; }
      .private-clue { margin-top: 20px; padding: 17px; border: 1px solid #c4cfbf; border-left: 4px solid var(--pine-light); border-radius: 13px; background: #eaf0e7; }
      .private-clue h3 { margin-bottom: 6px; font-size: 1.1rem; }
      .private-clue p { margin: 0; color: #354944; font: 600 1.03rem/1.45 Georgia, "Times New Roman", serif; }
      .item-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 13px; }
      .item-button { min-height: 42px; padding: 9px 11px; border: 1px solid #b7c7b9; border-radius: 10px; background: #fffdf8; color: var(--pine); cursor: pointer; font-weight: 750; }
      .item-button:hover:not(:disabled) { border-color: var(--pine); background: #f3f7f0; }
      .locked-note { margin-top: 18px; padding: 13px 15px; border-radius: 12px; background: #f3eddf; color: var(--muted); font-size: .9rem; }
      .answer-card { margin-top: 20px; padding: 18px; border: 1px solid #d7c293; border-radius: 14px; background: #f9efd4; }
      .answer-card h2 { margin: 0 0 5px; font-size: 1.4rem; }
      .answer-card p { margin: 0; color: var(--muted); }
      .sidebar { display: grid; gap: 16px; }
      .score-card, .progress-card { padding: 20px; }
      .score-card h2, .progress-card h2 { margin-bottom: 7px; font-size: 1.25rem; }
      .score-list { display: grid; gap: 7px; margin: 13px 0 0; padding: 0; list-style: none; }
      .score-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 9px; padding: 9px 10px; border-bottom: 1px solid #e7decc; }
      .score-row.me { border-radius: 10px; background: #edf1e8; }
      .score-row strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .score-value { min-width: 34px; color: var(--pine); text-align: right; font-size: 1.08rem; font-weight: 900; font-variant-numeric: tabular-nums; }
      .team-score { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding: 14px; border-radius: 12px; background: #e8eddc; color: var(--pine); font-weight: 800; }
      .progress-list { display: grid; gap: 8px; margin-top: 12px; }
      .progress-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: .86rem; }
      .progress-row strong { color: var(--ink); }
      .status-line { min-height: 25px; margin: 14px 0 0; color: var(--muted); font-size: .88rem; }
      .waiting-card { max-width: 720px; margin: 0 auto; padding: clamp(24px, 5vw, 48px); text-align: center; }
      .waiting-card h1 { margin: 10px auto; font-size: clamp(2rem, 5vw, 3.5rem); }
      .waiting-card .share-box { max-width: 420px; margin: 24px auto 0; text-align: left; }
      .result-card { padding: clamp(22px, 4vw, 40px); text-align: center; }
      .result-card h1 { margin: 0 auto 10px; font-size: clamp(2.2rem, 5vw, 3.5rem); }
      .result-card p { max-width: 550px; margin: 0 auto 20px; color: var(--muted); }
      .toast { position: fixed; z-index: 5; right: 22px; bottom: 22px; max-width: min(420px, calc(100vw - 44px)); padding: 12px 16px; border: 1px solid #c9b48c; border-radius: 12px; background: #fffaf0; box-shadow: var(--shadow); color: var(--ink); opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity 150ms ease, transform 150ms ease; }
      .toast.visible { opacity: 1; transform: translateY(0); }
      .toast.error { border-color: #d7a39a; color: var(--danger); }
      .loading-card { padding: 28px; color: var(--muted); text-align: center; }
      .muted { color: var(--muted); }
      .accent { color: var(--coral); }
      @media (max-width: 820px) {
        .home-card { grid-template-columns: 1fr; }
        .home-copy { padding-bottom: 16px; }
        .home-art { min-height: 260px; }
        .home-art::before { width: 250px; height: 250px; }
        .home-art::after { width: 194px; height: 194px; }
        .home-art svg { width: min(78%, 300px); }
        .lobby-grid, .round-grid { grid-template-columns: 1fr; }
        .choice-grid { grid-template-columns: 1fr; }
        .choice-card { min-height: 0; }
      }
      @media (max-width: 520px) {
        body { padding: 13px; }
        .masthead { margin-bottom: 14px; }
        .brand { font-size: 1.15rem; }
        .room-chip { padding: 7px 9px; font-size: .73rem; }
        .screen-header { display: grid; padding: 18px; }
        .header-actions { justify-content: flex-start; }
        .section-card, .score-card, .progress-card { padding: 17px; }
        .name-row, .join-form { align-items: stretch; flex-direction: column; }
        .end-row { align-items: stretch; flex-direction: column; }
        .location-grid, .item-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="masthead">
        <a class="brand" href="/" aria-label="Riddle Rally home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="6.7" stroke="#a77933" stroke-width="2.1"/><path d="m15.5 15.5 5 5" stroke="#173d36" stroke-width="2.7" stroke-linecap="round"/><path d="M10.5 7.1v6.8M7.1 10.5h6.8" stroke="#cb604d" stroke-width="1.1" stroke-linecap="round"/></svg>
          </span>
          <span>Riddle Rally</span>
        </a>
        <div id="room-chip"></div>
      </header>
      <main id="app" aria-live="polite">
        <section class="paper-card loading-card">Opening the map…</section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/client.js"></script>
  </body>
</html>
